model:
  name: "financial-fairness-llm"
  path: "Qwen/Qwen-7B-Chat"
  use_lora: true
  lora_r: 16
  lora_alpha: 32

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 3
  learning_rate: 1.5e-4

data:
  train_path: "data/train_fairness_cases.jsonl"
  val_path: "data/val_fairness_cases.jsonl"

federated_learning:
  enabled: true
  server_address: "127.0.0.1:8080"

evaluation:
  targets:
    fairness_bias: 0.05
    compliance_audit_pass_rate: 0.99
