model:
  name: "legal-contract-llm"
  path: "THUDM/chatglm3-6b"
  use_lora: true
  lora_r: 16
  lora_alpha: 32

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  num_epochs: 3
  learning_rate: 2.0e-4

data:
  train_path: "data/train_contracts.jsonl"
  val_path: "data/val_contracts.jsonl"

evaluation:
  targets:
    compliance_accuracy: 0.99
    confidentiality: true
